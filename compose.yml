services:
  wallet-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wallet-dashboard
    ports:
      - "8088:8080"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/live"]
      interval: 30s
      timeout: 3s
      retries: 3
