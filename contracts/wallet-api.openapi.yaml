openapi: 3.1.0
info:
  title: Wallet API
  version: 1.0.0
  description: Financial digital wallet API consuming Money VO, Idempotency-Key, and JWT authentication.
servers:
  - url: /api/v1
paths:
  /auth/register:
    post:
      summary: Register user and provision initial wallet
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                  minLength: 2
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 12
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - id
                  - name
                  - email
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  email:
                    type: string
                    format: email
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '409':
          $ref: '#/components/responses/ProblemResponse'

  /auth/login:
    post:
      summary: Authenticate user and issue token pair
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Successfully authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'

  /auth/refresh:
    post:
      summary: Refresh expired access token with rotating refresh token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Refreshed token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'

  /auth/logout:
    post:
      summary: Revoke refresh token
      operationId: logoutUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '204':
          description: Revoked successfully
        '400':
          $ref: '#/components/responses/ProblemResponse'

  /wallets/me:
    get:
      summary: Retrieve current authenticated user wallet
      operationId: getCurrentWallet
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current wallet details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '401':
          $ref: '#/components/responses/ProblemResponse'

  /wallets/me/deposits:
    post:
      summary: Deposit funds into current user wallet
      operationId: depositFunds
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                amount:
                  type: string
                  pattern: '^[0-9]+(\.[0-9]{2})$'
                  example: '150.00'
      responses:
        '201':
          description: Deposit confirmed
          headers:
            Idempotent-Replayed:
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'

  /wallets/me/withdrawals:
    post:
      summary: Withdraw funds from current user wallet
      operationId: withdrawFunds
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                amount:
                  type: string
                  pattern: '^[0-9]+(\.[0-9]{2})$'
                  example: '75.50'
      responses:
        '201':
          description: Withdrawal confirmed
          headers:
            Idempotent-Replayed:
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'

  /transfers:
    post:
      summary: Transfer funds to destination wallet
      operationId: transferFunds
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - destinationWalletId
                - amount
              properties:
                destinationWalletId:
                  type: string
                  format: uuid
                amount:
                  type: string
                  pattern: '^[0-9]+(\.[0-9]{2})$'
                  example: '50.00'
                description:
                  type: string
                  maxLength: 100
      responses:
        '201':
          description: Transfer executed
          headers:
            Idempotent-Replayed:
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/ProblemResponse'
        '401':
          $ref: '#/components/responses/ProblemResponse'
        '404':
          $ref: '#/components/responses/ProblemResponse'
        '422':
          $ref: '#/components/responses/ProblemResponse'

  /wallets/me/transactions:
    get:
      summary: List paginated transaction history
      operationId: getTransactions
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Page of transactions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageTransaction'
        '401':
          $ref: '#/components/responses/ProblemResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    ProblemResponse:
      description: RFC 7807 problem details
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'

  schemas:
    Money:
      type: object
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: '^[0-9]+(\.[0-9]{2})$'
          example: '100.00'
        currency:
          type: string
          enum: [BRL]
          default: BRL

    TokenPair:
      type: object
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
          default: Bearer
        expiresIn:
          type: integer
          default: 900

    Wallet:
      type: object
      required:
        - id
        - ownerId
        - balance
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        balance:
          $ref: '#/components/schemas/Money'
        createdAt:
          type: string
          format: date-time

    Transaction:
      type: object
      required:
        - id
        - type
        - amount
        - balanceAfter
        - counterpartyWalletId
        - description
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - DEPOSIT
            - WITHDRAWAL
            - TRANSFER_IN
            - TRANSFER_OUT
        amount:
          $ref: '#/components/schemas/Money'
        balanceAfter:
          $ref: '#/components/schemas/Money'
        counterpartyWalletId:
          type: string
          nullable: true
          format: uuid
        description:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    PageTransaction:
      type: object
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        page:
          type: integer
          default: 0
        size:
          type: integer
          default: 20
        totalElements:
          type: integer
        totalPages:
          type: integer

    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - instance
        - code
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - UNAUTHORIZED
            - FORBIDDEN
            - WALLET_NOT_FOUND
            - EMAIL_ALREADY_REGISTERED
            - CONCURRENT_MODIFICATION
            - INSUFFICIENT_FUNDS
            - SAME_WALLET_TRANSFER
            - IDEMPOTENCY_KEY_REUSED
            - RATE_LIMITED
        errors:
          type: array
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                type: string
              message:
                type: string
