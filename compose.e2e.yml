services:
  wallet-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wallet-dashboard-e2e
    ports:
      - "8088:8080"
    environment:
      - VITE_API_BASE_URL=http://wallet-api:8080/api/v1
    depends_on:
      wallet-api:
        condition: service_healthy
    networks:
      - wallet-network

  wallet-api:
    image: ghcr.io/alef-salu/wallet-api:latest
    container_name: wallet-api-e2e
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - wallet-network

networks:
  wallet-network:
    driver: bridge
